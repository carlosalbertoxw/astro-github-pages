name: Deploy to GitHub Pages

on:
  # Se ejecuta en cada push a la rama principal.
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Permisos que necesita el job de despliegue.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela el que ya esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build & upload
        uses: withastro/action@v3
        with:
          # La accion usa Node 20 por defecto y Astro 7 exige >=22.12.0,
          # asi que hay que indicarlo a mano.
          node-version: 22
          # path: .              # raiz del proyecto Astro dentro del repo
          # package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
